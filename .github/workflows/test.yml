name: Tests & Evaluation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      continue-on-error: true

    - name: Run unit and integration tests
      run: |
        pytest tests/ \
          --cov=backend \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=test-results.xml \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml

  api-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start backend server
      run: |
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
        sleep 5

    - name: Run API tests
      run: |
        pytest tests/api/ -v --timeout=30

    - name: Check server logs
      if: always()
      run: tail -50 server.log

  evaluation:
    runs-on: ubuntu-latest
    needs: api-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize FAISS index
      run: |
        python backend/scripts/build_faiss_index.py
      continue-on-error: true

    - name: Start backend server
      run: |
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
        sleep 5

    - name: Run AI evaluation
      run: |
        python eval/run_evaluation.py
      env:
        API_URL: "http://localhost:8000"

    - name: Upload evaluation report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: evaluation-report
        path: eval/evaluation_report_*.json

    - name: Check server logs
      if: always()
      run: tail -50 server.log

  data-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data validation tests
      run: |
        pytest tests/data/ -v

  build-status:
    runs-on: ubuntu-latest
    needs: [test, api-test, evaluation, data-validation]
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "❌ Unit tests failed"
          exit 1
        fi
        if [ "${{ needs.api-test.result }}" == "failure" ]; then
          echo "❌ API tests failed"
          exit 1
        fi
        if [ "${{ needs.evaluation.result }}" == "failure" ]; then
          echo "⚠️ Evaluation failed (non-blocking)"
        fi
        echo "✅ Build passed"
